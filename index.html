<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages Test</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon_jt_github_64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_jt_github_32.png">
<link rel="apple-touch-icon" href="assets/favicon_jt_github_180.png">
<style>
  :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#59636e; --accent:#1f883d; --border:#d1d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#151b23; --text:#e6edf3; --muted:#9198a1; --accent:#3fb950; --border:#3d444d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border);
          border-radius:12px; padding:28px; text-align:center; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-right:6px; }
  h1 { font-size:22px; margin:12px 0 6px; }
  p { color:var(--muted); margin:4px 0; font-size:14px; }
  .clock { font-size:36px; font-weight:600; margin:18px 0 4px; font-variant-numeric:tabular-nums; }
  button { margin-top:18px; padding:10px 18px; font-size:15px; border-radius:8px; cursor:pointer;
           border:1px solid var(--border); background:var(--accent); color:#fff; }
  .count { margin-top:10px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <p><span class="dot"></span>GitHub Pages 배포 성공</p>
    <h1>Hello, GitHub! 👋</h1>
    <p>Justin의 첫 GitHub 테스트 페이지</p>
    <div class="clock" id="clock">--:--:--</div>
    <p id="date"></p>
    <button id="btn">눌러보기</button>
    <div class="count" id="count">클릭 0회</div>
  </div>
<script>
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('ko-KR', { hour12:false });
    document.getElementById('date').textContent = now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  }
  tick(); setInterval(tick, 1000);
  let n = 0;
  document.getElementById('btn').onclick = () => { n++; document.getElementById('count').textContent = '클릭 ' + n + '회'; };
</script>
</body>
</html>
