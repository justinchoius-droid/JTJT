<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTJT Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon_jt_github_64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_jt_github_32.png">
<link rel="apple-touch-icon" href="assets/favicon_jt_github_180.png">
<style>
  :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#59636e; --accent:#1f883d;
          --border:#d1d9e0; --hover:#eaeef2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#151b23; --text:#e6edf3; --muted:#9198a1; --accent:#3fb950;
            --border:#3d444d; --hover:#212830; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  /* same width/height on every tab so switching tabs doesn't jump */
  .wrap { max-width:1240px; margin:0 auto; padding:8px 16px 8px; }

  /* compact header: logo + menu bar sit at the very top to leave room for app frames */
  header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  header img { width:30px; height:30px; border-radius:7px; }
  header h1 { font-size:17px; }
  header .title { display:flex; align-items:baseline; gap:8px; }
  header p { color:var(--muted); font-size:12px; }
  .clock { margin-left:auto; text-align:right; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:8px; }
  .clock b { font-size:16px; font-weight:600; }
  .clock span { color:var(--muted); font-size:12px; }

  nav { display:flex; gap:4px; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex-shrink:0; padding:7px 14px; font-size:14px; font-family:inherit; cursor:pointer;
               background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
               color:var(--muted); border-radius:6px 6px 0 0; }
  nav button:hover { color:var(--text); background:var(--hover); }
  nav button[aria-selected="true"] { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }

  .panel { margin-top:8px; min-height:calc(100vh - 107px); display:grid; place-items:center; text-align:center;
           background:var(--card); border:1px dashed var(--border); border-radius:12px; padding:32px 16px; }
  .panel h2 { font-size:18px; margin-bottom:6px; }
  .panel p { color:var(--muted); font-size:14px; }
  /* App tabs: GAS web app shown in a frame under the menu bar */
  .panel.app { display:flex; flex-direction:column; align-items:stretch; padding:0; border-style:solid; overflow:hidden; text-align:left; }
  .panel.app .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 14px;
                    border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
  .panel.app .bar a { margin-left:auto; color:var(--muted); }
  .panel.app iframe { display:block; width:100%; flex:1; min-height:480px; border:0; background:var(--card); }

  /* Home: dogs and cats, tilted like the original test page */
  .panel.home { border-style:solid; padding:36px 16px 44px; }
  .photos { display:flex; flex-wrap:wrap; justify-content:center; gap:18px 0; }
  .photos img { width:155px; height:155px; object-fit:cover; border-radius:14px; border:3px solid #fff;
                box-shadow:0 8px 28px rgba(0,0,0,0.22); margin:0 -10px; position:relative; }
  .photos img:nth-child(1) { transform:rotate( 9deg) translateY(12px); z-index:1; }
  .photos img:nth-child(2) { transform:rotate(-6deg) translateY( 6px); z-index:2; }
  .photos img:nth-child(3) { transform:rotate( 4deg) translateY( 2px); z-index:3; }
  .photos img:nth-child(4) { transform:rotate(-10deg)translateY(10px); z-index:2; }
  .photos img:nth-child(5) { transform:rotate( 2deg) translateY( 0px); z-index:4; }
  .photos img:nth-child(6) { transform:rotate(-5deg) translateY( 8px); z-index:3; }
  .photos img:nth-child(7) { transform:rotate( 8deg) translateY( 4px); z-index:2; }
  .photos img:nth-child(8) { transform:rotate(-3deg) translateY(10px); z-index:1; }
  .photos img:nth-child(9) { transform:rotate( 6deg) translateY( 6px); z-index:2; }
  @media (max-width:780px) { .photos img { width:120px; height:120px; margin:0 -8px; } }
  @media (max-width:520px) { .photos img { width:96px; height:96px; margin:0 -6px; } }

  /* hover lift (scale composes with each photo's rotate) */
  .photos img { cursor:zoom-in; transition:scale .2s ease, box-shadow .2s ease; }
  .photos img:hover { scale:1.08; z-index:10; box-shadow:0 14px 36px rgba(0,0,0,0.3); }
  .photos img.hold { visibility:hidden; }

  /* lightbox: the photo flies from its spot to the centre */
  .lb { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0); transition:background .35s ease; cursor:zoom-out; }
  .lb.on { background:rgba(0,0,0,0.78); }
  .lb img { position:fixed; object-fit:cover; border:3px solid #fff; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.45);
            transition:left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1),
                       height .38s cubic-bezier(.2,.8,.2,1), transform .38s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
  .lb button { position:fixed; top:50%; translate:0 -50%; width:44px; height:44px; border:0; border-radius:50%;
               background:rgba(255,255,255,0.16); color:#fff; font-size:22px; cursor:pointer; opacity:0; transition:opacity .3s, background .2s; }
  .lb.on button { opacity:1; }
  .lb button:hover { background:rgba(255,255,255,0.3); }
  .lb .prev { left:16px; } .lb .next { right:16px; }
  .lb .x { top:16px; right:16px; translate:none; font-size:18px; }
  @media (prefers-reduced-motion: reduce) { .lb, .lb img, .photos img { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/favicon_jt_github_256.png" alt="">
    <div class="title">
      <h1>JTJT Portal</h1>
      <p>Justin's portal</p>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
  </header>

  <nav id="tabs" role="tablist"></nav>
  <div id="panel" class="panel" role="tabpanel"></div>
</div>

<script>
  // Tabs 2–9 are placeholders — names and contents will be filled in later.
  const TABS = ['Home', 'Mail Analysis', '2', '3', '4', '5', '6', '7', '8', '9', 'Board'];
  const slug = name => name.toLowerCase().replace(/\s+/g, '-');

  // Tabs that show a Google Apps Script web app in a frame below the menu bar
  const APPS = {
    'Mail Analysis': {
      url: 'https://script.google.com/macros/s/AKfycbyhHgECZuqvMTiRBSincWyR5vhSh59xQvKEBhEKT3T2jHez-mFExy2YGf7GqucHfZoE/exec',
      desc: '받은편지함 수신 분석 · 도메인·발신자별 대화 수 (2026.02–11.14)',
    },
    'Board': {
      url: 'https://script.google.com/macros/s/AKfycbyoq0pOoh4E7RFAbprfkx6TQNt3oGXn-TZXFvpzZNw64cBJjJLAseUVR8_7CU3w2XF3/exec',
      desc: '나만의 게시판 · 메모·기록 (구글 시트에 저장)',
    },
  };
  const appPanel = (name, app) => '<div class="bar"><span>' + app.desc + '</span>' +
    '<a href="' + app.url + '" target="_blank" rel="noopener" title="화면이 안 뜨면 새 탭에서 여세요">새 탭에서 열기 ↗</a></div>' +
    '<iframe src="' + app.url + '" title="' + name + '"></iframe>';

  // dogs 🐶 and cats 🐱 (Unsplash), shown on Home
  const PHOTOS = [
    ['1601979031925-424e53b6caaa', 'dog'], ['1543852786-1cf6624b9987', 'cat'],
    ['1587402092301-725e37c70fd8', 'dog'], ['1561948955-570b270e7c36', 'cat'],
    ['1600804340584-c7db2eacf0bf', 'dog'], ['1511275539165-cc46b1ee89bf', 'cat'],
    ['1582456891925-a53965520520', 'dog'], ['1637424864367-7ab8752c19c6', 'cat'],
    ['1784385882549-cc09992b9bad', 'dog'],
  ];
  const HOME = '<div class="photos">' + PHOTOS.map(([id, alt]) =>
    '<img src="https://images.unsplash.com/photo-' + id + '?w=320&q=85&auto=format&fit=crop" alt="' + alt + '">').join('') + '</div>';

  const nav = document.getElementById('tabs');
  const panel = document.getElementById('panel');
  // ── Lightbox: click a photo → it flies to the centre and grows; ← → to browse, Esc/click to close
  const big = id => 'https://images.unsplash.com/photo-' + id + '?w=1400&h=1400&q=85&auto=format&fit=crop';
  let lb = null;
  function thumbBox(img) {               // untransformed size + on-screen centre + current tilt
    const r = img.getBoundingClientRect(), m = new DOMMatrix(getComputedStyle(img).transform);
    const w = img.offsetWidth;
    return { x: r.left + r.width / 2 - w / 2, y: r.top + r.height / 2 - w / 2, w, rot: Math.atan2(m.b, m.a) * 180 / Math.PI };
  }
  function place(el, b) {
    Object.assign(el.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.w + 'px', transform: 'rotate(' + (b.rot || 0) + 'deg)' });
  }
  function centreBox() {
    const w = Math.min(innerWidth * 0.86, innerHeight * 0.86, 900);
    return { x: (innerWidth - w) / 2, y: (innerHeight - w) / 2, w, rot: 0 };
  }
  function openLb(idx) {
    const thumbs = [...panel.querySelectorAll('.photos img')];
    const t = thumbs[idx];
    const ov = document.createElement('div'); ov.className = 'lb';
    ov.innerHTML = '<img alt=""><button class="prev" aria-label="이전">‹</button><button class="next" aria-label="다음">›</button><button class="x" aria-label="닫기">✕</button>';
    const im = ov.querySelector('img');
    im.src = t.src; place(im, thumbBox(t));
    document.body.appendChild(ov); t.classList.add('hold');
    lb = { ov, im, idx, thumbs };
    ov.getBoundingClientRect();          // commit start position before animating
    ov.classList.add('on'); place(im, centreBox());
    loadBig(idx);
    ov.addEventListener('click', e => { if (e.target === ov || e.target === im || e.target.classList.contains('x')) closeLb(); });
    ov.querySelector('.prev').onclick = e => { e.stopPropagation(); step(-1); };
    ov.querySelector('.next').onclick = e => { e.stopPropagation(); step(1); };
  }
  function loadBig(idx) {
    const pre = new Image(); pre.onload = () => { if (lb && lb.idx === idx) lb.im.src = pre.src; };
    pre.src = big(PHOTOS[idx][0]);
  }
  function step(d) {
    if (!lb) return;
    lb.thumbs[lb.idx].classList.remove('hold');
    lb.idx = (lb.idx + d + lb.thumbs.length) % lb.thumbs.length;
    lb.thumbs[lb.idx].classList.add('hold');
    lb.im.style.opacity = 0;
    setTimeout(() => { if (!lb) return; lb.im.src = lb.thumbs[lb.idx].src; lb.im.style.opacity = 1; loadBig(lb.idx); }, 180);
  }
  function closeLb() {
    if (!lb) return;
    const { ov, im, idx, thumbs } = lb; lb = null;
    ov.classList.remove('on'); place(im, thumbBox(thumbs[idx]));
    setTimeout(() => { ov.remove(); thumbs[idx].classList.remove('hold'); }, 380);
  }
  addEventListener('keydown', e => {
    if (!lb) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  addEventListener('resize', () => { if (lb) place(lb.im, centreBox()); });
  panel.addEventListener('click', e => {
    const t = e.target.closest('.photos img');
    if (t) openLb([...t.parentNode.children].indexOf(t));
  });

  function show(i) {
    [...nav.children].forEach((b, j) => b.setAttribute('aria-selected', j === i));
    panel.classList.toggle('home', i === 0);
    panel.classList.toggle('app', !!APPS[TABS[i]]);
    panel.innerHTML = i === 0 ? HOME
      : APPS[TABS[i]] ? appPanel(TABS[i], APPS[TABS[i]])
      : '<div><h2>' + TABS[i] + '</h2><p>Coming soon</p></div>';
    history.replaceState(null, '', '#' + slug(TABS[i]));
  }
  TABS.forEach((name, i) => {
    const b = document.createElement('button');
    b.role = 'tab';
    b.textContent = name;
    b.onclick = () => show(i);
    nav.appendChild(b);
  });
  // also accept the old numeric hashes (#1 … #10)
  const start = TABS.findIndex((t, i) => location.hash === '#' + slug(t) || (i > 0 && location.hash === '#' + i));
  show(start < 0 ? 0 : start);

  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false });
    document.getElementById('date').textContent = now.toLocaleDateString('en-US', { month:'short', day:'numeric', weekday:'short' });
  }
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
