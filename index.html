<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTJT Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon_jt_github_64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_jt_github_32.png">
<link rel="apple-touch-icon" href="assets/favicon_jt_github_180.png">
<style>
  :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#59636e; --accent:#1f883d;
          --border:#d1d9e0; --hover:#f3f6f9; --chip:#eff2f5; --lock:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#151b23; --text:#e6edf3; --muted:#9198a1; --accent:#3fb950;
            --border:#3d444d; --hover:#1c232c; --chip:#212830; --lock:#d29922; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:28px 16px 48px; }

  header { display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  header img { width:44px; height:44px; border-radius:10px; }
  header h1 { font-size:22px; }
  header p { color:var(--muted); font-size:13px; margin-top:2px; }
  .clock { margin-left:auto; text-align:right; font-variant-numeric:tabular-nums; }
  .clock b { display:block; font-size:20px; font-weight:600; }
  .clock span { color:var(--muted); font-size:12px; }

  .search { width:100%; padding:10px 12px; font-size:15px; border-radius:8px; margin-bottom:22px;
            border:1px solid var(--border); background:var(--card); color:var(--text); }
  .search:focus { outline:2px solid var(--accent); outline-offset:-1px; }

  h2 { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase;
       letter-spacing:.04em; margin:0 0 10px 2px; }
  section { margin-bottom:26px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }

  a.app { display:flex; flex-direction:column; gap:6px; padding:16px; border-radius:12px;
          background:var(--card); border:1px solid var(--border); color:inherit; text-decoration:none;
          transition:background .12s, border-color .12s; }
  a.app:hover { background:var(--hover); border-color:var(--accent); }
  .top { display:flex; align-items:center; gap:8px; }
  .code { font-size:11px; font-weight:600; padding:2px 7px; border-radius:6px; background:var(--chip); color:var(--muted); }
  .name { font-size:15px; font-weight:600; }
  .desc { font-size:13px; color:var(--muted); line-height:1.45; }
  .access { font-size:12px; color:var(--lock); margin-top:auto; padding-top:4px; }
  .empty { color:var(--muted); font-size:14px; padding:8px 2px; display:none; }
  footer { color:var(--muted); font-size:12px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/favicon_jt_github_256.png" alt="">
    <div>
      <h1>JTJT Portal</h1>
      <p>Justin's project web apps in one place</p>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
  </header>

  <input class="search" id="q" type="search" placeholder="Search apps…" autocomplete="off">
  <div id="sections"></div>
  <p class="empty" id="empty">No apps match.</p>

  <footer>Each app requires Google sign-in. Access is controlled inside each app.</footer>
</div>

<script>
  // Only links here. This repo is public, so no data goes on this page.
  const GAS = id => 'https://script.google.com/macros/s/' + id + '/exec';
  const GROUPS = [
    { title:'Warehouse', apps:[
      { code:'A16', name:'JUSTIN Assistant', desc:'Interview evaluation PDF, time off, card expenses',
        url:GAS('AKfycbyVyuOJ10dLtVeo9k2XtLNAL3hE-YWA_5ZjExJqQyhvIwqFpES_xqd7APo-Njg9sQ8W7w'), access:'Owner only' },
      { code:'A17', name:'Roll Call', desc:'Live attendance status from Fareclock',
        url:GAS('AKfycby5ioAug18Im1SO452xPLqieY4dR_XDVh9nIOp87y3LS2oLfwd4DSx7Bfvq85MriSZg'), access:'Allowed emails only' },
    ]},
    { title:'Data analysis', apps:[
      { code:'A23', name:'Contract Portal', desc:'Vendor contract status matrix',
        url:GAS('AKfycby5vAyXOjmogsIKHkV3gw0_pz9kkMDsflnJrXXTnMsHt_ozlIkrd76UrFf0_bKZGnl12g'), access:'Allowed emails only' },
      { code:'A25', name:'Staffing Overview', desc:'Tenure, attendance and labor rate dashboard',
        url:GAS('AKfycby8P34DJp4FsUfBccwyfWP4t2YoGZKu1HOHBfXCx8hpqY9V5LqmBHURbgT4L6whWya0'), access:'Allowed emails only' },
      { code:'A26-1', name:'Forecast P&L', desc:'Revenue and cost input → P&L forecast',
        url:GAS('AKfycbxGwXmdvqSDicbEbAbEO4mBA5rlnKbOTippwSd-tJ4jFGb0FSEF542REZsZskbaLpRc8g'), access:'Allowed emails only' },
    ]},
  ];

  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function render(q) {
    q = q.trim().toLowerCase();
    let shown = 0;
    document.getElementById('sections').innerHTML = GROUPS.map(g => {
      const apps = g.apps.filter(a => !q || (a.code + ' ' + a.name + ' ' + a.desc).toLowerCase().includes(q));
      shown += apps.length;
      if (!apps.length) return '';
      return '<section><h2>' + esc(g.title) + '</h2><div class="grid">' + apps.map(a =>
        '<a class="app" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="top"><span class="code">' + esc(a.code) + '</span><span class="name">' + esc(a.name) + '</span></div>' +
          '<div class="desc">' + esc(a.desc) + '</div>' +
          '<div class="access">🔒 ' + esc(a.access) + '</div></a>').join('') + '</div></section>';
    }).join('');
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
  }
  document.getElementById('q').addEventListener('input', e => render(e.target.value));
  render('');

  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false });
    document.getElementById('date').textContent = now.toLocaleDateString('en-US', { month:'short', day:'numeric', weekday:'short' });
  }
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
