<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages Test</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon_jt_github_64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_jt_github_32.png">
<link rel="apple-touch-icon" href="assets/favicon_jt_github_180.png">
<style>
  :root { --bg:#f0f4f0; --card:#fff; --text:#1f2328; --muted:#59636e; --accent:#1f883d; --border:#d1d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#151b23; --text:#e6edf3; --muted:#9198a1; --accent:#3fb950; --border:#3d444d; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:16px 16px 190px;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* ── Photo strip at bottom ── */
  .photo-strip {
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    pointer-events:none;
    z-index:0;
    padding:0 8px;
  }
  .photo-strip img {
    width:155px;
    height:155px;
    object-fit:cover;
    border-radius:14px;
    border:3px solid #fff;
    box-shadow:0 8px 28px rgba(0,0,0,0.22);
    flex-shrink:0;
    margin:0 -20px;
  }
  /* each photo gets a slightly different tilt + depth */
  .photo-strip img:nth-child(1) { transform:rotate( 9deg) translateY(28px); z-index:1; }
  .photo-strip img:nth-child(2) { transform:rotate(-6deg) translateY(14px); z-index:2; }
  .photo-strip img:nth-child(3) { transform:rotate( 4deg) translateY( 6px); z-index:3; }
  .photo-strip img:nth-child(4) { transform:rotate(-10deg)translateY(22px); z-index:2; }
  .photo-strip img:nth-child(5) { transform:rotate( 2deg) translateY( 2px); z-index:4; }
  .photo-strip img:nth-child(6) { transform:rotate(-5deg) translateY(18px); z-index:3; }
  .photo-strip img:nth-child(7) { transform:rotate( 8deg) translateY(10px); z-index:2; }
  .photo-strip img:nth-child(8) { transform:rotate(-3deg) translateY(24px); z-index:1; }
  .photo-strip img:nth-child(9) { transform:rotate( 6deg) translateY(16px); z-index:2; }

  @media (max-width:780px) {
    .photo-strip img { width:120px; height:120px; margin:0 -16px; }
    body { padding-bottom:150px; }
  }
  @media (max-width:520px) {
    .photo-strip img { width:90px; height:90px; margin:0 -12px; }
    body { padding-bottom:115px; }
  }

  /* ── Card ── */
  .card {
    position:relative; z-index:1;
    width:100%; max-width:440px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:30px;
    text-align:center;
    box-shadow:0 4px 24px rgba(0,0,0,0.08);
  }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-right:6px; }
  h1  { font-size:22px; margin:12px 0 6px; }
  p   { color:var(--muted); margin:4px 0; font-size:14px; }
  .clock { font-size:36px; font-weight:600; margin:18px 0 4px; font-variant-numeric:tabular-nums; }
  button {
    margin-top:18px; padding:10px 18px; font-size:15px;
    border-radius:8px; cursor:pointer;
    border:1px solid var(--border); background:var(--accent); color:#fff;
  }
  .count { margin-top:10px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>

  <!-- dogs 🐶 and cats 🐱 gathered together at the bottom -->
  <div class="photo-strip">
    <img src="https://images.unsplash.com/photo-1601979031925-424e53b6caaa?w=320&q=85&auto=format&fit=crop" alt="dog">
    <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=320&q=85&auto=format&fit=crop" alt="cat">
    <img src="https://images.unsplash.com/photo-1587402092301-725e37c70fd8?w=320&q=85&auto=format&fit=crop" alt="dog">
    <img src="https://images.unsplash.com/photo-1561948955-570b270e7c36?w=320&q=85&auto=format&fit=crop" alt="cat">
    <img src="https://images.unsplash.com/photo-1600804340584-c7db2eacf0bf?w=320&q=85&auto=format&fit=crop" alt="dog">
    <img src="https://images.unsplash.com/photo-1511275539165-cc46b1ee89bf?w=320&q=85&auto=format&fit=crop" alt="cat">
    <img src="https://images.unsplash.com/photo-1582456891925-a53965520520?w=320&q=85&auto=format&fit=crop" alt="dog">
    <img src="https://images.unsplash.com/photo-1637424864367-7ab8752c19c6?w=320&q=85&auto=format&fit=crop" alt="cat">
    <img src="https://images.unsplash.com/photo-1784385882549-cc09992b9bad?w=320&q=85&auto=format&fit=crop" alt="dog">
  </div>

  <div class="card">
    <p><span class="dot"></span>GitHub Pages Deployed Successfully</p>
    <h1>Hello, GitHub! 👋</h1>
    <p>Justin's First GitHub Test Page</p>
    <div class="clock" id="clock">--:--:--</div>
    <p id="date"></p>
    <button id="btn">Click me</button>
    <div class="count" id="count">0 clicks</div>
  </div>

<script>
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour12:false });
    document.getElementById('date').textContent  = now.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  }
  tick(); setInterval(tick, 1000);
  let n = 0;
  document.getElementById('btn').onclick = () => {
    n++;
    document.getElementById('count').textContent = n + (n === 1 ? ' click' : ' clicks');
  };
</script>
</body>
</html>
